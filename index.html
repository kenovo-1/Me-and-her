<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to Our Love</h1>
            <p>Our special space, just for the two of us.</p>
        </header>

        <section class="calendar">
            <h2>Love Calendar</h2>
            <button onclick="openCalendar()">Open Calendar</button>
        </section>

        <section class="messages">
            <h2>Flirty Messages</h2>
            <button onclick="generatePickupLine()">Get a Pickup Line</button>
            <div id="pickupLine"></div>
        </section>

        <section class="songs">
            <h2>Our Songs</h2>
            <input type="text" id="songSearch" placeholder="Search songs">
            <button onclick="searchSong()">Search on YouTube</button>
        </section>

        <section class="notes">
            <h2>Leave a Note</h2>
            <textarea id="noteInput" placeholder="Write a note..."></textarea>
            <button onclick="saveNote()">Save Note</button>
            <div id="savedNotes"></div>
        </section>

        <footer>
            <p>Made with love by Us</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
